
<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <h1>Sentiment Analysis</h1>

        <p>Enter your text below to analyze its sentiment.</p>

        <form method="POST">
            <textarea name="text"
                      placeholder="Type your text here..."
                      required>{{ user_text }}</textarea>

            <button type="submit">Analyze Sentiment</button>
        </form>

        {% if sentiment %}
            <div class="result">
                <h2>Analysis Result</h2>

                <p>
                    <b>Sentiment:</b> {{ sentiment }}
                </p>

                {% if polarity != "" %}
                    <p>
                        <b>Polarity Score:</b>
                        {{ "%.2f"|format(polarity) }}
                    </p>

                    <p>
                        <b>Subjectivity Score:</b>
                        {{ "%.2f"|format(subjectivity) }}
                    </p>
                {% endif %}
            </div>
        {% endif %}
    </div>

</body>
</html>
